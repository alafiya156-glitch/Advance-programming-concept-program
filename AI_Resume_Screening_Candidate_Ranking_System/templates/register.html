{% extends "base.html" %}{% block content %}<section class="auth"><small>CANDIDATE PORTAL</small><h1>Create account</h1><p class="muted">Admin accounts cannot be created through public registration.</p><form method="post"><label>Full name<input name="name" required minlength="2" maxlength="80" pattern="[A-Za-z][A-Za-z .'-]*" title="Use letters, spaces, dots, apostrophes or hyphens only"></label><label>Email<input type="email" name="email" required maxlength="254" autocomplete="email"></label><label>Password (8+ characters)<input type="password" name="password" minlength="8" maxlength="128" required autocomplete="new-password"></label><button class="btn">Register</button></form><p>Already registered? <a href="{{url_for('login')}}">Log in</a></p></section>{% endblock %}
