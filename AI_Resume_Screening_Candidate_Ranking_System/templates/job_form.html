{% extends "base.html" %}{% block content %}<small>ADMIN WORKSPACE</small><h1>{{'Edit vacancy' if job else 'Create vacancy'}}</h1><form class="formbox" method="post"><div class="two"><label>Job title *<input name="title" required maxlength="100" value="{{job['title'] if job else ''}}"></label><label>Department<input name="department" maxlength="80" value="{{job['department'] if job else ''}}"></label><label>Location<input name="location" maxlength="100" value="{{job['location'] if job else ''}}"></label><label>Job type<select name="job_type">{% for t in ['Full-time','Part-time','Internship','Contract'] %}<option {% if job and job['job_type']==t %}selected{% endif %}>{{t}}</option>{% endfor %}</select></label></div><label>Description *<textarea name="description" rows="5" minlength="20" maxlength="5000" required>{{job['description'] if job else ''}}</textarea></label><label>Required skills *<small>Comma-separated, e.g. Python, Flask, SQL, Machine Learning, Pandas</small><textarea name="required_skills" rows="3" maxlength="1000" required>{{job['required_skills'] if job else ''}}</textarea></label><label>Status<select name="status"><option {% if not job or job['status']=='Open' %}selected{% endif %}>Open</option><option {% if job and job['status']=='Closed' %}selected{% endif %}>Closed</option></select></label><button class="btn">{{'Save changes' if job else 'Publish vacancy'}}</button></form>{% endblock %}
